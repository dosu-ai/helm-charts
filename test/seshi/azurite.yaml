# Azure's Blob Storage emulator for the seshi chart's install test (STORE=az
# scripts/seshi-e2e.sh). Not for use beyond a throwaway cluster: the account and key are
# Azurite's published development ones, and there is no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: azurite
spec:
  selector:
    matchLabels: { app: azurite }
  template:
    metadata:
      labels: { app: azurite }
    spec:
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:3.38.0@sha256:c26024d62bf4a5b88a40968afd217234c00e1fc9a4790dc6105d1ca7979f6eec
          args: [azurite-blob, --blobHost, 0.0.0.0, --blobPort, "10000"]
          ports:
            - containerPort: 10000
          readinessProbe:
            tcpSocket: { port: 10000 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: azurite
spec:
  selector: { app: azurite }
  ports:
    - port: 10000
      targetPort: 10000
