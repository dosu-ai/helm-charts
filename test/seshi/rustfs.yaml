# An S3-compatible bucket for the seshi chart's install test (scripts/seshi-e2e.sh). Not for use
# beyond a throwaway cluster: fixed keys, no volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  selector:
    matchLabels: { app: rustfs }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
          env:
            - { name: RUSTFS_ACCESS_KEY, value: rustfsadmin }
            - { name: RUSTFS_SECRET_KEY, value: rustfsadmin }
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket: { port: 9000 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector: { app: rustfs }
  ports:
    - port: 9000
      targetPort: 9000
