name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read the repository and nothing more. Actions are pinned to commit SHAs, the release in the
# comment; Dependabot (.github/dependabot.yml) proposes the updates.
permissions:
  contents: read

jobs:
  # A pull request that changes a chart bumps its version (README.md, "Working on a chart").
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Changed charts have a new version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          for chart in charts/*/; do
            chart="${chart%/}"
            git diff --quiet "$BASE" HEAD -- "$chart" && continue
            new="$(sed -n 's/^version: //p' "$chart/Chart.yaml")"
            old="$(git show "$BASE:$chart/Chart.yaml" 2>/dev/null | sed -n 's/^version: //p')"
            if [ -z "$old" ]; then
              echo "$chart: new chart at $new"
            elif [ "$new" = "$old" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" != "$new" ]; then
              echo "::error file=$chart/Chart.yaml::$chart changed but its version is still $old (now $new): bump it"
              status=1
            else
              echo "$chart: $old -> $new"
            fi
          done
          exit "$status"

  # Lint and render the seshi chart under both Helm majors, check every config it renders with
  # its own seshi release, refuse the values it must refuse, and validate the manifests.
  seshi-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.22.1, v4.3.2]
    env:
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ matrix.helm }}
      - name: Install kubeconform
        run: |
          curl -fsSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  /tmp/kubeconform.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - run: bun scripts/seshi-check.ts

  # Install the seshi chart on kind against RustFS: bootstrap, upload, search, restart.
  seshi-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: seshi-chart
      - run: scripts/seshi-e2e.sh
