name: release

# Publishes each chart version: the package at oci://ghcr.io/dosu-ai/charts/<chart>, a tag
# <chart>-<version>, and a GitHub release with the package attached. Each part is checked on
# its own, so a run that failed halfway is finished by the next one. Only main publishes.
on:
  push:
    branches: [main]
    paths: ["charts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release
      packages: write # ghcr.io/dosu-ai/charts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Publish new chart versions
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          registry="oci://ghcr.io/$OWNER/charts"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          mkdir -p dist
          for chart in charts/*/; do
            chart="${chart%/}"
            name="$(sed -n 's/^name: //p' "$chart/Chart.yaml")"
            version="$(sed -n 's/^version: //p' "$chart/Chart.yaml")"
            tag="$name-$version"
            helm package "$chart" --destination dist >/dev/null
            package="dist/$name-$version.tgz"

            # The registry: push unless GitHub lists this version's tag on the package. The
            # package not existing yet (404) means no version of it is published.
            if tags="$(gh api --paginate "orgs/$OWNER/packages/container/charts%2F$name/versions" \
              --jq '.[].metadata.container.tags[]' 2>/tmp/packages.err)"; then
              :
            elif grep -q 'HTTP 404' /tmp/packages.err; then
              tags=""
            else
              echo "::error::listing $registry/$name: $(cat /tmp/packages.err)"
              exit 1
            fi
            if printf '%s\n' "$tags" | grep -qx "$version"; then
              echo "$registry/$name:$version is published"
            else
              helm push "$package" "$registry"
            fi

            # The tag and the GitHub release, with the package attached and fully uploaded (an
            # upload cut short leaves an empty asset in the "starter" state).
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --target "$GITHUB_SHA" --title "$name $version" \
                --notes "helm install $name $registry/$name --version $version (see charts/$name/README.md)"
            fi
            asset="$(gh release view "$tag" --json assets \
              --jq ".assets[] | select(.name == \"$name-$version.tgz\") | \"\(.state) \(.size)\"")"
            case "$asset" in
              "uploaded "[1-9]*) echo "$tag has its package" ;;
              *)
                [ -n "$asset" ] && gh release delete-asset "$tag" "$name-$version.tgz" --yes
                gh release upload "$tag" "$package"
                ;;
            esac

            # A new GHCR package starts private, and GitHub's API cannot change that: an org
            # admin makes it public once, in the package's settings.
            if ! HELM_REGISTRY_CONFIG=/tmp/anonymous.json helm show chart "$registry/$name" --version "$version" >/dev/null 2>&1; then
              echo "::warning::$registry/$name is not public yet. Make it public: https://github.com/orgs/$OWNER/packages/container/charts%2F$name/settings"
            fi
          done
