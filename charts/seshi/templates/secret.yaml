{{- /* Checked here too: Helm renders this before the ConfigMap, and its own error would hide the
reason. */}}
{{- include "seshi.validate" . }}
{{- $c := .Values.store.credentials }}
{{- if and (not $c.existingSecret) $c.accessKeyId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "seshi.suffixed" (dict "root" . "suffix" "store") }}
  labels:
    {{- include "seshi.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $c.keys.accessKeyId }}: {{ $c.accessKeyId | b64enc | quote }}
  {{ $c.keys.secretAccessKey }}: {{ required "store.credentials.secretAccessKey is required with store.credentials.accessKeyId" $c.secretAccessKey | b64enc | quote }}
{{- end }}
