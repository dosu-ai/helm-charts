{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "seshi.fullname" . }}
  labels:
    {{- include "seshi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "seshi.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    # The release's own `helm test` pod.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "seshi.name" . | quote }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
              app.kubernetes.io/component: test
      ports:
        - port: http
          protocol: TCP
{{- end }}
