# Azure Blob Storage with a SAS token from an existing Secret, and the runtime config in the
# bucket: the admin API's config and source routes write there, and sources' secrets are sealed
# with a key from another Secret.
store:
  url: az://sessions/seshi
  accountName: acmeseshi
  credentials:
    existingSecret: seshi-azure
    keys:
      accountKey: ""
      sasToken: sas-token
config:
  server:
    runtime_config: store
  secrets:
    key_id: k1
    keys:
      k1:
        env: SEAL_KEY_1
extraEnv:
  - name: SEAL_KEY_1
    valueFrom:
      secretKeyRef:
        name: seshi-sealing
        key: k1
